name: Build unsigned Hassany IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Compile for iPhone without signing
        run: |
          set -euo pipefail
          xcodebuild -project ios/HassanyIPA.xcodeproj -scheme HassanyIPA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/HassanyIPA.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/HassanyIPA-unsigned.ipa" Payload)
          unzip -t dist/HassanyIPA-unsigned.ipa | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: HassanyIPA-unsigned
          path: dist/HassanyIPA-unsigned.ipa
          retention-days: 14
