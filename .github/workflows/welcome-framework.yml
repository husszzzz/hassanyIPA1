name: Build native Hassany welcome framework
on:
  workflow_dispatch:
  push:
    paths:
      - 'integration/**'
      - '.github/workflows/welcome-framework.yml'
permissions:
  contents: read
jobs:
  ios-framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile arm64 iOS framework
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist/HassanyGate.framework
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -fobjc-arc -dynamiclib -framework UIKit -framework QuartzCore -framework Foundation -Wl,-install_name,@rpath/HassanyGate.framework/HassanyGate -o dist/HassanyGate.framework/HassanyGate integration/HassanyWelcome.m
          python3 -c 'import plistlib; plistlib.dump(dict(CFBundleIdentifier="com.hassany.gate", CFBundleExecutable="HassanyGate", CFBundlePackageType="FMWK", CFBundleInfoDictionaryVersion="6.0"), open("dist/HassanyGate.framework/Info.plist", "wb"))'
          xcrun file dist/HassanyGate.framework/HassanyGate
      - uses: actions/upload-artifact@v4
        with:
          name: HassanyGate-framework-unsigned
          path: dist/HassanyGate.framework
